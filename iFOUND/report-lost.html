<!DOCTYPE html>
<html>
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1.0" name="viewport"/>
  <title>
   Report Lost - iFOUND
  </title>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <div class="loading">
   <h1>
    iFOUND
   </h1>
   <p>
    Finding lost things...
   </p>
   <div class="bar">
    <span>
    </span>
   </div>
  </div>
  <header class="header">
   <div class="brand">
    <a class="logo" href="index.html">
     i
     <span>
      FOUND
     </span>
     🔎
    </a>
    <div class="tagline">
     Never Lose Hope
    </div>
   </div>
   <button class="menu">
    ☰
   </button>
   <nav class="nav">
    <a href="index.html">
     Home
    </a>
    <a href="lost.html">
     Lost
    </a>
    <a href="report-lost.html">
     Report Lost
    </a>
    <a href="found.html">
     Found
    </a>
    <a href="report-found.html">
     Report Found
    </a>
    <a href="profile.html">
     Profile
    </a>
   </nav>
  </header>
  <main class="report">
   <h1 class="page-title">
    Report Lost Item
   </h1>
   <form class="report-box" id="lostForm">
    <div class="field">
     <label>
      Item Name
     </label>
     <input id="itemName" required=""/>
    </div>
    <div class="field">
     <label>
      Category
     </label>
     <select id="itemCategory">
      <option>
       Electronics
      </option>
      <option>
       Documents
      </option>
      <option>
       Accessories
      </option>
      <option>
       Books
      </option>
      <option>
       Clothing
      </option>
      <option>
       Other
      </option>
     </select>
    </div>
    <div class="field">
     <label>
      Date Lost
     </label>
     <input id="itemDate" required="" type="date"/>
    </div>
    <div class="field">
     <label>
      Location Lost
     </label>
     <input id="itemLocation" required=""/>
    </div>
    <div class="field">
     <label>
      Description
     </label>
     <textarea id="itemDescription" required=""></textarea>
    </div>
    <div class="field">
     <label>
      Your Contact Number
     </label>
     <input id="itemContact" required=""/>
    </div>
    <div class="field">
     <label>
      Additional Information
     </label>
     <textarea id="itemExtra"></textarea>
    </div>
    <div class="field">
     <label>
      Upload Image
     </label>
     <input accept="image/*" id="itemImage" type="file"/>
    </div>
    <p class="success" id="formMsg">
    </p>
    <button class="primary">
     Report Lost Item
    </button>
   </form>
  </main>
  <script src="js/script.js">
  </script>
 </body>
</html>
